[project]
name = "accidents_route_pr_diction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "matplotlib>=3.10.8",
    "mkdocs-material>=9.7.2",
    "mkdocstrings>=1.0.3",
    "mypy>=1.19.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "ruff>=0.15.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "streamlit>=1.53.1",
    "uvicorn>=0.40.0",
    "xgboost>=3.1.3",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers --cov=api --cov-report=term-missing"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "api/app/__init__.py:__version__",
]
branch = "main"
major_on_zero = false
tag_commit = true
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease_token = "beta"
prerelease = true
prerelease_version_pattern = "beta\\d+"

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = ["chore\\(release\\):.*"]

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "chore", "ci"]
minor_tag = "feat"
patch_tag = "fix"
default_bump_level = 0

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = true

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "safety>=3.7.0",
    "python-semantic-release>=9.11.8",
    "types-requests>=2.32.4.20260107",
]
